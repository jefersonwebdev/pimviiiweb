<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamOn - Login</title>
    <link rel="stylesheet" href="./css/styles.css">
    </head>
<body>
    <div class="login-container">
        <h1 class="logo">StreamOn</h1>
        <div class="card-login">
            <h2>Bem-vindo de Volta</h2>
            <p>Faça login para continuar</p>
            
            <form action="#" method="POST">
                
                <div class="input-field">
                    <input type="email" id="email" name="email" placeholder=" " required>
                    <label for="email">E-mail</label>
                </div>
                
                <div class="input-field">
                    <input type="password" id="password" name="password" placeholder=" " required>
                    <label for="password">Senha</label>
                </div>
                
                <a href="#" class="forgot-password">Esqueceu a senha?</a>
                
                <button type="submit" class="login-button">ENTRAR</button>
            </form>

            <div class="social-login">
                <p>ou entre com:</p>
                <div class="social-icons">
                    <button class="social-btn google-btn">G</button>
                    <button class="social-btn facebook-btn">f</button>
                </div>
            </div>

            <p class="register-link">Não tem uma conta? <a href="#">Cadastre-se</a></p>

        </div>
    </div>
</body>
</html>
