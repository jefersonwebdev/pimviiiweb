<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamOn - Login</title>
    <!-- Carrega o Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Configuração customizada do Tailwind para usar a fonte Inter -->
     <link rel="stylesheet" href="./css/styles.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'creator-dark-purple': '#3B0764', // Cor principal da sidebar
                        'creator-light-purple': '#9333ea', // Cor de destaque (purple-600)
                    }
                }
            }
        }
    </script>
    <style>
        /* Define a fonte Inter para toda a página */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');

        /* Estilo base para o fundo (pode adicionar um padrão de fundo sutil se desejar) */
        body {
            background-color: var(--dark-gray-bg); /* gray-100 */
        }

        .botao {
            background-color: var(--light-green);
        }

        .texto-verde {
            color: var(--light-green);
        }

        .texto-verde-escuro {
            color: var(--dark-green);
        }

        .container2 {
            max-width: 450px; /* Largura máxima para simular um celular */
            margin: 0 auto;
            background-color: var(--dark-green); /* Cor principal do app */
            
            box-shadow: 0 0 50px rgba(0, 200, 100, 0.3); /* Sombra verde */
            border-radius: 30px; /* Bordas arredondadas do "celular" */
            overflow: hidden; /* Garante que o conteúdo não vaze */
            position: relative;
            padding-bottom: 70px; /* Espaço para a nav bar inferior */
        }
    </style>
</head>
<body class="font-sans min-h-screen flex items-center justify-center p-4">

    <!-- Card Principal de Login (Centrado) -->
    <div class="container2 w-full max-w-md bg-white p-8 md:p-10 rounded-xl shadow-2xl transition-all duration-300 transform hover:shadow-creator-light-purple/50">

        <!-- Header e Branding -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold texto-verde mb-1">
                <img class="logo-img" src="./img/logo.png" alt="">StreamOn
            </h1>
            <p class="text-sm text-gray-500 mb-6">
                Seus vídeos favoritos em um só lugar.
            </p>

            <h2 class="text-2xl font-semibold text-gray-900">
                Entrar
            </h2>
            <p class="text-sm text-gray-600 mt-1">
                Novo por aqui? 
                <a href="#" class="texto-verde font-medium hover:text-creator-dark-purple transition-colors">
                    Crie sua conta
                </a>
            </p>
        </div>

        <!-- Formulário de Login (Agora sem botões sociais e divisor) -->
        <form id="login-form" action="#" method="POST" class="space-y-6">
            <!-- Campo E-mail -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">E-mail</label>
                <div class="mt-1">
                    <input 
                        id="email" 
                        name="email" 
                        type="email" 
                        autocomplete="email" 
                        required 
                        placeholder="seu.email@exemplo.com"
                        class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-creator-light-purple focus:border-creator-light-purple sm:text-sm"
                    >
                </div>
            </div>

            <!-- Campo Senha -->
            <div>
                <div class="flex items-center justify-between">
                    <label for="password" class="block text-sm font-medium text-gray-700">Senha</label>
                    <div class="text-sm">
                        <a href="#" id="forgot-password-link" class="font-medium text-gray-500 hover:text-creator-light-purple transition-colors">
                            Esqueceu a senha?
                        </a>
                    </div>
                </div>
                <div class="mt-1 relative">
                    <input 
                        id="password" 
                        name="password" 
                        type="password" 
                        autocomplete="current-password" 
                        required 
                        placeholder="Digite sua senha"
                        class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-creator-light-purple focus:border-creator-light-purple sm:text-sm"
                    >
                    <!-- Ícone "olho" para alternar visibilidade -->
                    <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 transition-colors">
                        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Checkbox Lembrar de mim -->
            <div class="flex items-center">
                <input 
                    id="remember-me" 
                    name="remember-me" 
                    type="checkbox" 
                    class="h-4 w-4 text-creator-light-purple border-gray-300 rounded focus:ring-creator-light-purple"
                >
                <label for="remember-me" class="ml-2 block text-sm text-gray-900">
                    Lembrar de mim
                </label>
            </div>

            <!-- Botão de Ação Principal (Entrar) -->
            <div>
                <button 
                    type="submit" 
                    class="botao w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-md text-base font-medium text-white  hover:bg-creator-dark-purple focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-creator-light-purple transition-colors transform hover:scale-[1.01]"
                >
                    Entrar
                </button>
            </div>
        </form>
    </div>

    <!-- Message Box Overlay (Customizado para substituir o alert) -->
    <div id="message-box" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white p-6 rounded-xl shadow-2xl max-w-sm w-full transform transition-transform duration-300 scale-95" id="message-modal-content">
            <h3 id="message-title" class="text-xl font-bold mb-3"></h3>
            <p id="message-content" class="text-gray-600 mb-6"></p>
            <button id="message-ok-btn" class="w-full py-2 rounded-lg text-white font-medium bg-creator-light-purple hover:bg-creator-dark-purple transition-colors shadow-md">
                OK
            </button>
        </div>
    </div>

    <!-- Lógica JavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('login-form');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const togglePasswordButton = document.getElementById('toggle-password');

            // Credenciais fixas para demonstração
            const EMAIL_CORRETO = 'joao@email.com';
            const SENHA_CORRETA = 'senha123';

            // Elementos da Caixa de Mensagem
            const messageBox = document.getElementById('message-box');
            const messageTitle = document.getElementById('message-title');
            const messageContent = document.getElementById('message-content');
            const messageOkBtn = document.getElementById('message-ok-btn');
            const messageModalContent = document.getElementById('message-modal-content');

            // Função para exibir a caixa de mensagem customizada
            function showMessage(title, content, isSuccess = false) {
                messageTitle.textContent = title;
                messageContent.textContent = content;

                // Estilo baseado no resultado
                messageTitle.classList.remove('text-red-600', 'text-green-600');
                if (isSuccess) {
                    messageTitle.classList.add('text-green-600');
                } else {
                    messageTitle.classList.add('text-red-600');
                }

                // Exibe o modal com transição
                messageBox.classList.remove('hidden', 'opacity-0');
                messageBox.classList.add('opacity-100');
                messageModalContent.classList.remove('scale-95');
                messageModalContent.classList.add('scale-100');
                messageOkBtn.focus();
            }

            // Função para esconder a caixa de mensagem
            function hideMessage() {
                messageBox.classList.remove('opacity-100');
                messageBox.classList.add('opacity-0');
                messageModalContent.classList.remove('scale-100');
                messageModalContent.classList.add('scale-95');
                
                // Esconde o elemento principal após a transição
                setTimeout(() => {
                    messageBox.classList.add('hidden');
                }, 300); 
            }

            // Event listener para o botão OK
            messageOkBtn.addEventListener('click', hideMessage);

            // 1. Lógica de Submissão do Formulário
            form.addEventListener('submit', (event) => {
                event.preventDefault(); // Impede o envio padrão do formulário

                const email = emailInput.value.trim();
                const password = passwordInput.value;

                if (email === EMAIL_CORRETO && password === SENHA_CORRETA) {
                    // Login Bem-Sucedido
                    showMessage(
                        'Login Efetuado', 
                        'Bem-vindo(a) de volta! Redirecionando para o painel...', 
                        true
                    );

                    // Redirecionamento após 1.5 segundo 
                    // ATUALIZADO: Redireciona para dashboard.html
                    setTimeout(() => {
                        window.location.href = 'index.html'; 
                    }, 1500);

                } else {
                    // Erro de Login
                    showMessage(
                        'Falha no Login', 
                        'E-mail ou senha incorretos. Por favor, verifique suas credenciais e tente novamente.'
                    );
                }
            });
            
            // 2. Lógica para Alternar Visibilidade da Senha
            togglePasswordButton.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
            });

            // 3. Lógica para fechar a caixa de mensagem ao clicar no fundo
            messageBox.addEventListener('click', (e) => {
                if (e.target.id === 'message-box') {
                    hideMessage();
                }
            });
            
            // 4. Lógica para o link "Esqueceu a Senha?"
            document.getElementById('forgot-password-link').addEventListener('click', (e) => {
                 e.preventDefault();
                 showMessage(
                    'Recuperação de Senha', 
                    'A função de recuperação de senha não está implementada nesta demonstração.'
                );
            });
        });
    </script>
</body>
</html>
