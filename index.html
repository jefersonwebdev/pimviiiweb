<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamOn</title>
    <link rel="shortcut icon" href="./img/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="./css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-background"></div> <div class="container">
        <header class="main-header">
            <div class="logo"><img class="logo-img" src="./img/logo.png" alt=""><span>StreamOn</span></div>
            <div class="header-icons">
                <span class="icon search-icon"></span>
                <span class="icon bell-icon"></span>
            </div>
        </header>

        <section class="hero-banner" style="background-image: url('./img/thumbnail-canva-destaque-home.png');">
            <div class="overlay"></div>
            <div class="banner-content">
                <h1 class="banner-title">Inteligência Artificial</h1>
                <p class="banner-genres">Curso, Tecnologia, Aulas</p>
                <div class="banner-actions">
                    <button class="btn btn-play"><span class="icon play-icon"></span>Play</button>
                    <button class="btn btn-mylist"><span class="icon add-icon"></span>Minha PLaylist</button>
                </div>
            </div>
        </section>

        <main class="content-sections">
            <section class="content-row">
                <div class="row-header">
                    <h2>Top Vídeos</h2>
                    <span class="see-all">Ver Tudo</span>
                </div>
                <div class="cards-container">
                    <div class="anime-card">
                        <div class="rating">9.5</div>
                        <div class="rank">1</div>
                        <img src="./img/anime_1.jpg" alt="Anime 1" class="card-thumbnail">
                        </div>
                    <div class="anime-card">
                        <div class="rating">9.7</div>
                        <div class="rank">2</div>
                        <img src="./img/anime_2.jpg" alt="Anime 2" class="card-thumbnail">
                        </div>
                    <div class="anime-card">
                        <div class="rating">9.5</div>
                        <div class="rank">3</div>
                        <img src="./img/anime_3.jpg" alt="Anime 3" class="card-thumbnail">
                        </div>
                </div>
            </section>

            <section class="content-row">
                <div class="row-header">
                    <h2>Novidades</h2>
                    <span class="see-all">Ver tudo</span>
                </div>
                <div class="cards-container">
                    <div class="anime-card square">
                        <div class="rating">9.5</div>
                        <img src="./img/thumbnail-canva-home-top1.png" alt="Episode 1" class="card-thumbnail">
                        </div>
                    <div class="anime-card square">
                        <div class="rating">9.8</div>
                        <img src="./img/thumbnail-canva-home-top2.png" alt="Episode 2" class="card-thumbnail">
                        </div>
                    <div class="anime-card square">
                        <div class="rating">9.7</div>
                        <img src="./img/thumbnail-canva-home-top3.png" alt="Episode 3" class="card-thumbnail">
                        </div>
                    <div class="anime-card square">
                        <div class="rating">9.6</div>
                        <img src="./img/episode_4.jpg" alt="Episode 4" class="card-thumbnail">
                        </div>
                </div>
            </section>

        </main>

        <nav class="bottom-nav">
            <a href="#" class="nav-item active">
                <span class="icon home-icon"></span>
                <span>Home</span>
            </a>
            <a href="#" class="nav-item">
                <span class="icon calendar-icon"></span>
                <span>Novidades</span>
            </a>
            <a href="playlist.html" class="nav-item">
                <span class="icon mylist-icon"></span>
                <span>Playlist</span>
            </a>
            <a href="#" class="nav-item">
                <span class="icon download-icon"></span>
                <span>Download</span>
            </a>
            <a href="profile.html" class="nav-item">
                <span class="icon profile-icon"></span>
                <span>Perfil</span>
            </a>
        </nav>
    </div>

</body>
</html>
